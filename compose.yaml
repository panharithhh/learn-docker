# LibraFlow local stack: Postgres + Redis + the API, on one private network.
#   docker compose up -d --build                 → db, redis and api (API on localhost:${API_PORT:-3000})
#   docker compose run --rm seed                 → schema + demo data in the compose database
#   docker compose --profile observability up -d → also Jaeger, Prometheus and Grafana
# Rollback: API_IMAGE_TAG=<old commit sha> runs that published image instead (see README.md).
# Inside the network, containers reach each other by service name: the API
# connects to "db" and "redis", never "localhost". .env sets DB_HOST=db and REDIS_HOST=redis.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: libraflow
      POSTGRES_PASSWORD: libraflow
      POSTGRES_DB: libraflow_dev
    ports:
      # Host port 5433, so it doesn't clash with a Postgres already on 5432
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      # Named volume: the data outlives `docker compose down` (only `down -v` deletes it)
      - pgdata:/var/lib/postgresql/data
      # Creates libraflow_test for the E2E suite on first start
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libraflow -d libraflow_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # BullMQ queues (overdue scans, reminders). Only the API talks to it, so no host port.
  redis:
    image: redis:7-alpine

  api:
    build: .
    # `--build` builds this checkout and tags it :local. Set API_IMAGE_TAG to a commit SHA
    # to run that image from ghcr.io instead (rollback, see README.md).
    image: ghcr.io/panharithhh/libraflow-api:${API_IMAGE_TAG:-local}
    env_file: .env
    environment: &stack-env
      # Built from DB_HOST in .env (Compose reads .env for ${...} too)
      DATABASE_URL: postgres://libraflow:libraflow@${DB_HOST:-db}:5432/libraflow_dev
      DB_SSL: 'false'
      # Always the redis service here, whatever .env says for running on the host
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '${API_PORT:-3000}:3000'
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # One-off: `docker compose run --rm seed`. Uses the Dockerfile's build stage, which still has
  # the dev dependencies (faker) the seed needs. It refuses any database but a local one.
  seed:
    profiles: ['tools']
    build:
      context: .
      target: build
    image: libraflow-seed:local
    env_file: .env
    environment: *stack-env
    command: ['node', 'dist/database/seeds/dev-seed.js']
    depends_on:
      db:
        condition: service_healthy

  # ---- observability (optional) ----
  jaeger:
    profiles: ['observability']
    image: jaegertracing/jaeger:2.5.0
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP/HTTP

  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.3.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    profiles: ['observability']
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
